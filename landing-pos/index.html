<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Don Punto · Landing nuevo (revisión)</title>
<style>body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#f4f4f0;color:#1c211c}header{padding:24px 20px;max-width:1200px;margin:auto}h1{margin:0 0 6px;font-size:26px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tabs button{border:0;border-radius:999px;padding:10px 18px;font-weight:600;background:#fff;cursor:pointer}.tabs button.on{background:#16895F;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 20px 40px;max-width:1200px;margin:auto}.grid.mob{max-width:840px}.col h2{font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}.col img{width:100%;display:block;border-radius:12px;box-shadow:0 10px 30px -15px #0005;background:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body>
<header><h1>Don Punto · landing nuevo</h1><p>Izquierda: como está hoy. Derecha: propuesta (aún NO publicada en donpunto.com).</p>
<div class="tabs"><button id="b1" class="on" onclick="v('desk')">Computadora</button><button id="b2" onclick="v('mob')">Celular</button></div></header>
<div id="g" class="grid"><div class="col"><h2>Antes</h2><img id="a" src="before-desk.jpg"></div><div class="col"><h2>Después</h2><img id="d" src="after-desk.jpg"></div></div>
<script>function v(k){a.src='before-'+k+'.jpg';d.src='after-'+k+'.jpg';g.className='grid'+(k=='mob'?' mob':'');b1.className=k=='desk'?'on':'';b2.className=k=='mob'?'on':''}</script></body></html>
