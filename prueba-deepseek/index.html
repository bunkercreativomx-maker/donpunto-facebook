const D={"ds": "# Migrar de caja manual a POS: guía paso a paso para tu restaurante o negocio de comida\n\n## Migrar de caja manual a POS: qué quieres lograr y qué te está frenando\n\nCerrar el turno sin diferencias, saber cuánto ganaste hoy y dejar de depender de una libreta es una meta concreta. Lo que frena a la mayoría de los dueños de fondas, taquerías, cafeterías y negocios de comida no es la tecnología: es el miedo a desordenar la operación, a terminar capturando todo dos veces y a que el sistema falle justo en la hora pico. Esta guía ordena el cambio en pasos para que decidas con información y sin detener el servicio.\n\nDon Punto es un software de punto de venta en la nube para restaurantes y negocios de comida en México. Si quieres ver el panorama completo antes de empezar, revisa el [punto de venta para restaurantes en México](https://donpunto.com/) o escribe a soporte@donpunto.com con tus dudas.\n\n## Por qué tu caja manual ya te cuesta tiempo (aunque todavía funcione)\n\nLa caja manual funciona… hasta que deja de hacerlo. Al inicio todo cabe en una libreta: lo que entró en efectivo, lo que se fue con tarjeta, lo que pidieron por apps de comida a domicilio. El problema aparece cuando el negocio crece un poco y ya hay tres personas cobrando, dos turnos y un menú con extras.\n\nAhí se ven los síntomas clásicos: archivos con nombres como «corte_final_v3», fórmulas que nadie revisa hasta el cierre, propinas que se mezclan con las ventas, tickets de la terminal bancaria que se guardan en un sobre y ventas de apps anotadas a mano en una hoja que se pierde. Y siempre hay una persona que «domina el archivo»: si falta, el corte se detiene.\n\nEl costo no es solo el tiempo del cierre. Es no saber con claridad cuánto ganaste, qué platillo te deja margen y cuánto dinero debería haber en la caja al final del día.\n\nSi quieres ver este punto a detalle, te sirve la comparación entre [POS en la nube y hojas de cálculo](https://donpunto.com/blog/pos-en-la-nube-vs-hojas-calculo), y si decides seguir un rato con el método actual, aquí tienes la guía de [cómo hacer el corte de caja manual](https://donpunto.com/blog/como-hacer-corte-de-caja-manual) para al menos estandarizarlo.\n\n## Paso 1: Confirma si ya es momento de migrar (y cuándo conviene esperar)\n\nNo hay una fecha mágica. Hay señales que se repiten:\n\n- **Más de una persona cobra.** Si dos o tres personas manejan efectivo y tarjeta, la libreta se vuelve un acuerdo verbal.\n- **El corte no cuadra seguido.** Diferencias pequeñas repetidas casi siempre significan que falta un registro, no que alguien se llevó el dinero.\n- **No sabes tu margen por platillo.** Vendes mucho y no sabes si esas ventas te dejan utilidad.\n- **Dependes de una sola persona.** Si el corte solo lo puede cerrar el encargado, el negocio se detiene cuando esa persona falta.\n- **Tu menú ya es estable.** Precios y productos que cambian poco son más fáciles de cargar y de revisar.\n\n¿Cuándo conviene esperar? Si tu menú cambia casi todos los días, si todavía no tienes claro cómo cobras (efectivo, tarjeta, transferencia) o si el volumen es tan pequeño que un cuaderno te basta, ordena primero tu operación. Migrar sobre una operación desordenada solo traslada el desorden a una pantalla.\n\n## Paso 2: Confirma el costo y el equipo que ya tienes antes de decidir\n\nAntes de tocar nada, conviene tener claros dos números: cuánto cuesta el sistema y cuánto te costaría el equipo. En Don Punto los planes son mensuales y en pesos mexicanos:\n\n- **Plan Básico: $350 MXN al mes.**\n- **Plan Pro: $799 MXN al mes**, con clientes frecuentes y reportes avanzados.\n\nLa primera suscripción de cada cuenta incluye 15 días gratis; la prueba se otorga una sola vez por negocio. El cobro de tu suscripción con tarjeta lo procesa Stripe: es el pago del software, no tiene nada que ver con el cobro que tú le haces a tus comensales en el mostrador.\n\nPuedes comparar el detalle en la página de [planes y precios](https://donpunto.com/) y revisar las condiciones completas en los [Términos y Condiciones](https://donpunto.com/terminos).\n\n### Equipo: qué no necesitas comprar\n\nFunciona en el celular, la tablet o la computadora que ya tienes. Para impresoras, confirma con soporte antes de conectar o comprar equipo.\n\n## Lo que un POS no hace (y conviene saber antes de migrar)\n\nMigrar con expectativas claras evita frustraciones en la semana uno:\n\n- **No hace trámites fiscales por ti.** Te separa el IVA de cada venta y te ayuda con tus números, pero los cálculos son herramientas de apoyo y no sustituyen a tu contador; el cumplimiento fiscal de tu negocio es tu responsabilidad.\n- **No está integrado con apps de comida a domicilio ni con Google.** No recibe pedidos de esas plataformas automáticamente, no sincroniza menús ni precios con ellas y no centraliza sus pedidos. Esas ventas se capturan a mano en la caja.\n- **La calculadora de precios por app es solo una calculadora.** Te ayuda a definir a qué precio subir cada platillo considerando comisión, IVA y retenciones, pero no se conecta con las plataformas.\n- **La IA puede equivocarse.** El escáner de menú y la lectura de facturas de proveedor agilizan la captura, pero siempre hay que revisar los resultados antes de usarlos.\n\nEstos límites están descritos en los [Términos y Condiciones](https://donpunto.com/terminos); leerlos antes de migrar te ahorra malos entendidos.\n\n## Paso 3: Reúne tu información base antes de tocar el sistema\n\nEsta es la parte que casi todos se saltan y la que más tiempo ahorra. Ten a la mano, en un solo lugar:\n\n- **Menú y precios vigentes**, con nombres tal como los dices en el mostrador.\n- **Modificadores y extras**: «sin cebolla», «doble queso», «con papas», tamaños y combinaciones.\n- **Formas de pago que aceptas**: efectivo y tarjeta.\n- **Tu fondo de caja**: con cuánto efectivo abre cada turno y cómo lo separas.\n- **Equipo que ya usas** y, si vas a imprimir, la impresora con la que trabajas.\n- **Cómo registras hoy las ventas de apps de comida a domicilio**, para replicar ese registro a mano en el sistema.\n\nCon esta lista resuelta, la carga inicial es más ordenada y evitas corregir sobre la marcha.\n\n### Qué hacer con tu historial en papel o Excel\n\nTus cortes anteriores son tu respaldo: consérvalos en papel o en tu archivo, ordenados por fecha, y tenlos a la mano si tu contador los pide. El arranque del sistema se hace con el menú y los precios vigentes, no con el historial; para los días previos, el respaldo impreso o digital sigue siendo tu fuente de consulta.\n\n## Paso 4: Carga el menú y los precios sin capturar todo a mano\n\nEl menú desde una foto convierte tu menú impreso en productos con IA. Es el atajo más útil de la migración: en lugar de teclear cincuenta platillos, tomas la foto del menú que ya tienes y revisas lo que el sistema propuso.\n\nLa revisión es obligatoria y va en este orden:\n\n1. **Nombres**: que coincidan con lo que el cliente pide y con lo que dice el ticket.\n2. **Precios**: uno por uno, incluyendo los que cambiaron esta semana.\n3. **Categorías**: entradas, fuertes, bebidas, postres, para que el cajero encuentre rápido en hora pico.\n4. **Modificadores y extras**: que cada platillo tenga las opciones que realmente ofreces.\n\nDespués haz una venta de prueba con un platillo de cada categoría: cobra y revisa que el importe y el IVA se vean como esperas. Si algo no coincide, se corrige antes de abrir al público.\n\n## Paso 5: Configura cómo cobras y cómo quieres cerrar el turno\n\nAquí defines las reglas del dinero. Lo mínimo:\n\n- **Formas de pago que aceptas**: efectivo y tarjeta.\n- **IVA separado en cada venta**, con la tasa que corresponda a tu operación, para que el desglose salga solo al cierre.\n- **Ventas de apps de comida a domicilio capturadas a mano**, como un canal aparte, para que no se mezclen con efectivo ni con tarjeta.\n\nEse último punto es el que más orden da: el corte de caja separa efectivo, tarjeta y ventas de apps de comida a domicilio. Así, al final del día sabes cuánto entró por cada canal y qué parte de ese dinero todavía no llega a tu cuenta porque la plataforma la deposita después.\n\nLas decisiones fiscales formales (cómo declaras, cómo deduces) no las resuelve ningún software: eso se consulta con tu contador. Para el detalle del cierre, apóyate en la guía de [corte de caja manual](https://donpunto.com/blog/como-hacer-corte-de-caja-manual).\n\n## Paso 6: Define quién cobra y quién autoriza (usuarios, PIN y permisos)\n\nUn usuario y una contraseña compartidos son el equivalente digital de la libreta abierta. El sistema permite PIN por empleado y permisos para cajeros y gerentes, así que úsalo desde el primer día:\n\n- **Un PIN distinto por persona**, nunca «el de la caja».\n- **Define qué puede hacer cada rol** con los permisos disponibles.\n- **Reserva las autorizaciones sensibles** para gerencia o para ti.\n\nDurante la transición pasa algo muy común: por prisa, alguien presta su PIN. Si eso ocurre, el registro pierde sentido justo cuando más lo necesitas, que es la primera semana. Define desde el inicio que cada quien entra con su propio PIN.\n\n## Paso 7: Prepara inventario y recetas para ver tu margen real\n\nEsta etapa responde la pregunta que la libreta nunca contesta: ¿qué platillo me deja dinero?\n\n- **Inventario y recetas con costo real y margen por platillo.**\n- **Inventario que se descuenta solo con la venta**, con avisos al celular cuando algo se está agotando.\n- **Facturas de proveedor leídas con IA**, que capturan las compras al inventario.\n\nNo necesitas cargar todo el inventario el primer día. Empieza por los diez insumos que más rotan y por tres o cuatro platillos estrella; con eso ya tienes una lectura útil de costos y después amplías.\n\n## Paso 8: Opera en paralelo los primeros días (sin duplicar trabajo para siempre)\n\nLa doble captura es un puente, no un modo de vida. Define desde el inicio cuántos días dura: por ejemplo, tres a cinco turnos, o hasta que dos cierres seguidos coincidan con el conteo físico.\n\nDurante ese periodo:\n\n- Cobra todo en el sistema y lleva tu libreta solo como comprobación del cierre.\n- Compara al final de cada turno el efectivo contado contra el reporte del sistema.\n- Anota cualquier diferencia el mismo día, mientras recuerdes qué pasó.\n\n**Si se va el internet a media hora pico**, sigues cobrando en el mismo equipo: el sistema funciona sin conexión y sincroniza con la nube al volver la conexión. Mientras haya ventas pendientes de respaldarse, evita borrar los datos del navegador del equipo; cuando regrese la conexión, se respaldan solas.\n\n## Paso 9: Cierra tu primer corte digital y capacita a tu equipo por rol\n\nEl primer corte digital se lee en tres pasos: revisa el desglose por forma de pago, verifica el IVA separado de cada venta y compara el efectivo que debería haber contra lo que contaste físicamente. Si tienes plan Pro, los reportes avanzados te muestran horas pico, mejores días y platillos estrella, y puedes descargarlos en hoja de cálculo o PDF.\n\nLa meta no es un corte perfecto el día uno. Es que con la práctica el cierre sea más claro y te deje evidencia de lo que pasó en el turno.\n\n### Capacitación corta por rol: cajero, mesero y gerente\n\nNo hace falta una sesión larga; hace falta práctica por separado:\n\n- **Cajero**: cobro en efectivo y tarjeta, cierre de turno y manejo de su PIN.\n- **Mesero**: usar extras y modificadores al levantar el pedido.\n- **Gerente o dueño**: autorizaciones con PIN, revisión del corte y comparación contra el conteo físico.\n\nUna buena práctica es que cada persona haga varias ventas de prueba y luego una real supervisada. Cuando quieras medir el desempeño del equipo después de migrar, revisa la guía de [medir ventas por empleado](https://donpunto.com/blog/medir-ventas-por-empleado).\n\n## Cómo se ve hacerlo bien (y cómo se ve quedarse igual)\n\nCuando la migración se hace en orden, el cierre del turno deja de ser una negociación. Abres el reporte, ves el desglose por forma de pago, revisas el IVA y sabes si la caja cuadra. Si algo no coincide, tienes un punto de partida claro para revisar. El dueño puede revisar el día desde el celular.\n\nCuando no se hace, todo sigue igual: la libreta se moja, el archivo se duplica, el corte depende de una persona, las ventas de apps se anotan donde se puede y las decisiones se toman con la sensación de «creo que hoy vendimos bien». La diferencia no es un número: es la tranquilidad de saber, y el tiempo que recuperas al final del día.\n\n## Preguntas frecuentes\n\n### ¿Necesito comprar equipo nuevo para migrar de caja manual a un POS?\n\nNo. Funciona en el celular, la tablet o la computadora que ya tienes. Si vas a imprimir, confirma con soporte antes de conectar o comprar equipo.\n\n### ¿Cuánto cuesta migrar y qué incluye cada plan?\n\nPlan Básico: $350 MXN al mes. Plan Pro: $799 MXN al mes, con clientes frecuentes y reportes avanzados.\n\n### ¿Cómo funciona la prueba gratis?\n\nLa primera suscripción de cada cuenta incluye 15 días gratis. La prueba se otorga una sola vez por negocio.\n\n### ¿Puedo pasar mi menú al sistema sin capturar platillo por platillo?\n\nSí, con el menú desde una foto: la IA convierte el menú impreso en productos. Después revisas nombres, precios, categorías y modificadores antes de cobrar con ellos.\n\n### ¿Qué pasa si se va el internet a media hora pico?\n\nSigues cobrando en el mismo equipo y, cuando regresa la conexión, las ventas se sincronizan con la nube. Evita borrar los datos del navegador mientras haya movimientos pendientes de respaldarse.\n\n### Después de migrar, ¿cómo queda el corte con efectivo, tarjeta y pedidos de apps de comida a domicilio?\n\nEl corte separa efectivo, tarjeta y ventas de apps de comida a domicilio. Las ventas de apps se registran a mano en la caja para que el total del día quede claro por canal.\n\n### ¿El sistema se encarga de mis impuestos?\n\nNo. Te separa el IVA de cada venta y te ayuda con tus números, pero no sustituye a tu contador; el cumplimiento fiscal de tu negocio es tu responsabilidad.\n\n### ¿Cómo controlo quién cobra y quién autoriza?\n\nCon un PIN por empleado y permisos para cajeros y gerentes. Define qué puede hacer cada rol y reserva las autorizaciones sensibles para gerencia o para el dueño.\n\n## Si prefieres no hacerlo solo, aquí puedes empezar\n\nOrdenar el cambio es más fácil cuando alguien te dice por dónde empezar y qué revisar antes de abrir al público. Don Punto es un software de punto de venta en la nube para restaurantes y negocios, con servicio en línea para todo México.\n\nEscríbenos a **soporte@donpunto.com** con tu caso: qué tipo de negocio tienes, cuántas personas cobran y cómo llevas hoy el corte. Así podemos revisar qué opción te queda mejor.\n\nPuedes revisar los planes en la página de Don Punto —Básico $350 MXN al mes y Pro $799 MXN al mes—. La primera suscripción de cada cuenta incluye 15 días gratis (se otorga una sola vez por negocio). Los detalles completos están en los Términos y Condiciones, y si quieres seguir leyendo sobre operación diaria, entra al [blog de Don Punto](https://donpunto.com/blog).", "gp": "# Migrar de caja manual a POS\n\n## Resumen ejecutivo: ¿por qué migrar ahora?\nSi llevas cobros y cortes en hojas o en una caja manual, migrar a un POS en la nube te ahorra tiempo cada día y te da control inmediato sobre ventas e inventario. Con un POS reduces capturas dobles, haces cierres más rápidos y ves qué productos realmente dejan margen.\n\nPara negocios de comida en México, Don Punto es un software de punto de venta en la nube que funciona en el celular, tablet o computadora que ya tienes. Permite hacer el corte de caja separando efectivo, tarjeta y apps por tipo de pago, gestiona inventario y recetas con costo real por platillo y sigue operando aunque se caiga el internet; cuando vuelve la conexión, sincroniza con la nube.\n\n¿Necesitas ayuda para hacerlo sin detener la operación? Escríbenos a soporte@donpunto.com.\n\nConoce más del producto en la [página principal de Don Punto](https://donpunto.com/).\n\n---\n\n## ¿Qué es un POS y cómo difiere de una caja manual?\nUn POS (Point of Sale) es un sistema que centraliza cobros, productos, inventario, usuarios y reportes. A diferencia de la caja manual y el cuaderno:\n- Registra cada venta con productos, impuestos y forma de pago.\n- Calcula totales y separa IVA por venta conforme a la tasa aplicable.\n- Actualiza inventario automáticamente al vender.\n- Controla permisos por usuario para reducir errores o accesos indebidos.\n- Genera reportes listos para análisis y contabilidad.\n\nEn un negocio de comida, esto significa: tickets claros, cortes ágiles, menos diferencias en arqueos y visibilidad del margen por platillo.\n\n---\n\n## Beneficios prácticos para restaurantes\n- Corte de caja más ágil: separa efectivo, tarjeta y apps por tipo de pago para conciliar más rápido.\n- Costo real y margen por platillo: registra recetas e insumos y conoce el margen para ajustar precios o porciones a tiempo.\n- Precios para delivery sin sorpresas: calcula precios considerando comisiones de Uber Eats, DiDi Food y Rappi (comisión + IVA + retenciones SAT) antes de publicar.\n- Reportes accionables: identifica horas pico, mejores días y platillos estrella; exporta a Excel o PDF para compartir con tu equipo o con tu contador.\n- Operación sin internet: si se cae la conexión, puedes seguir cobrando y el sistema sincroniza al volver.\n\n---\n\n## Preparación previa: datos y documentos que debes tener listos\nReúne todo antes de mover un dedo en el POS. Esto reduce errores y te permite arrancar en días, no semanas.\n\nChecklist de preparación:\n- Menú actualizado con precios y variantes (tamaño, extras, combos).\n- Recetas por platillo: lista de insumos y cantidades.\n- Inventario inicial: existencias y costo de cada insumo y producto.\n- Último cierre de caja: totales por forma de pago y arqueos.\n- Lista de empleados: quién cobra, quién administra, quién ve reportes.\n- Proveedores frecuentes: para capturar compras y actualizar inventario.\n\nConsejos prácticos:\n- Usa nombres de productos claros y consistentes (ej. “Taco al pastor — orden 5 pz”).\n- Define reglas de redondeo de precios antes de cargar el menú.\n- Si tienes el menú impreso, prepara fotos legibles; con Don Punto puedes usar un escáner de menú con IA para convertir la foto en productos y luego revisarlos.\n- Si manejarás datos personales en pedidos o clientes, revisa el [Aviso de Privacidad](https://donpunto.com/privacidad) de la plataforma que elijas para entender cómo se tratan los datos.\n\n---\n\n## Paso a paso: plan de migración (checklist detallada)\nSigue esta secuencia para minimizar interrupciones.\n\n¿Quieres acompañamiento en vivo? Escríbenos a soporte@donpunto.com.\n\n### Respaldos de registros manuales (paso 1)\n- Escanea o fotografía tus cierres y arqueos recientes.\n- Captura en una hoja resumen: ventas por día y por forma de pago de los últimos 7–14 días.\n- Revisa que el efectivo y las ventas declaradas coincidan en tu último cierre.\n\n### Creación de cuenta y elección de plan (paso 2)\n- Abre tu cuenta en el POS elegido.\n- Antes de suscribirte, revisa los [Términos y Condiciones](https://donpunto.com/terminos) para conocer alcance del servicio y políticas.\n- Nota: en Don Punto la suscripción es mensual y se renueva automáticamente con cargo al método de pago registrado.\n\n### Carga e importación del menú y platillos (paso 3)\n- Convierte tu menú en productos con nombres, variantes y precios.\n- En Don Punto puedes usar “Menú desde una foto”: la IA convierte tu menú impreso en productos. Revisa y corrige nombres, categorías y precios antes de publicar.\n- Crea combos y modifica variantes cuando aplique.\n\n### Parametrización de IVA y comisiones de delivery (paso 4)\n- Si vendes en apps de entrega, utiliza la calculadora integrada para fijar precios considerando la comisión de cada plataforma, el IVA y las retenciones aplicables.\n\n### Configuración de usuarios y permisos (paso 5)\n- Asigna un PIN por empleado y define permisos para cajeros y gerentes.\n- Si tienes varias sucursales, configúralas y separa caja, corte e inventario por local.\n\n### Pruebas en modo offline (paso 6)\n- Vuelve a conectar y verifica que todo sincronice correctamente.\n\n### Primer día en producción y conciliación (paso 7)\n- Haz un turno piloto con registro doble: POS + tu método actual.\n- Realiza el corte del día separando efectivo, tarjeta y apps por tipo de pago.\n- Compara existencias: confirma que el inventario bajó según las ventas registradas.\n- Documenta cualquier diferencia y ajústala para el día 2.\n\nConsulta más detalles y acceso en la [página principal de Don Punto](https://donpunto.com/).\n\n---\n\n## Cómo importar y validar menú, recetas e inventario\n- Menú y productos: usa nombres comprensibles para el cajero y para el comensal. Agrega categorías (Desayunos, Tacos, Bebidas). Si importaste desde foto con IA, verifica ortografía, variantes y precios.\n- Recetas: define insumos y cantidades exactas por platillo. Esto permite ver el costo real por receta y su margen. Ajusta por merma si es necesario.\n- Inventario inicial: captura existencias y costos actuales. Registra compras a proveedores conforme lleguen para mantener costos al día.\n- Validación: realiza 10–20 ventas de prueba, haz un corte y confirma que salidas de inventario y márgenes coincidan con tus expectativas. Corrige recetas o unidades de medida antes de abrir al público.\n\n---\n\n## Hardware y compatibilidades (qué necesitas y qué ya puedes usar)\n- Dispositivos principales: Don Punto funciona en el celular, la tablet o la computadora que ya tienes.\n- Conectividad: si se cae el internet, puedes seguir cobrando y sincroniza cuando vuelve.\n- Periféricos habituales a considerar:\n  - Impresora de tickets.\n  - Cajón de dinero.\n- Recomendaciones:\n  - Verifica que tus periféricos funcionen con tu dispositivo principal.\n  - Ten un segundo dispositivo listo como respaldo para picos de venta o contingencias.\n\n---\n\n## Pagos con tarjeta y seguridad\n- Procesamiento de tarjetas: en Don Punto, los pagos con tarjeta se procesan mediante Stripe.\n- Buenas prácticas de seguridad:\n  - No compartas tu cuenta ni contraseñas; usa PIN por empleado y permisos diferenciados.\n  - Cambia el PIN de administrador por uno único y resguárdalo.\n  - Limita quién puede hacer cancelaciones, descuentos y cortes.\n  - Revisa accesos y movimientos sensibles al cierre de cada día.\n- Para conocer cómo se tratan tus datos y los de tus clientes, revisa el [Aviso de Privacidad](https://donpunto.com/privacidad).\n\n---\n\n## Fiscalidad y CFDI: qué debes saber\n- Exporta reportes (por día, formas de pago, productos) en Excel o PDF y compártelos con tu contador.\n- Verifica en los [Términos y Condiciones](https://donpunto.com/terminos) del servicio el alcance de funcionalidades fiscales del POS que utilices.\n- Coordínate con tu contador para definir el flujo de información contable (cortes diarios, reportes semanales, compras a proveedores) y cumplir a tiempo.\n\n---\n\n## Cómo conciliar la caja manual con los primeros cierres del POS\n1) Corre en paralelo 1–2 días: registra ventas en el POS y conserva tu formato manual como respaldo.\n2) Haz el corte en el POS separando efectivo, tarjeta y apps; realiza un arqueo físico de caja.\n3) Compara totales por forma de pago y número de tickets; investiga diferencias típicas:\n- Productos sin receta o con receta incompleta (salidas de inventario no esperadas).\n- Tasa de IVA mal asignada en algún producto.\n- Descuentos aplicados sin política clara.\n- Venta registrada en efectivo pero cobrada con tarjeta o viceversa.\n4) Ajusta recetas, IVA y permisos; documenta el cambio.\n5) Cuando la diferencia sea menor a tu umbral operativo, deja la caja manual y trabaja al 100% con el POS.\n\n---\n\n## Plan de 3 días para poner el POS en marcha\n¿Poco tiempo e datos y proveedores involucrados: Aviso de Privacidad\n\n¿Quieres una sesión de arranque y revisión de tu caso? soporte@donpunto.com.\n\n---\n\n## Checklist imprimible (descargable)\nImprime o copia esta lista y márcala al avanzar.\n\n- Preparación\n  - [ ] Menú actualizado con precios y variantes\n  - [ ] Recetas completas con unidades y cantidades\n  - [ ] Inventario inicial con costos\n  - [ ] Último cierre y arqueos recientes\n  - [ ] Lista de empleados y roles\n  - [ ] Proveedores frecuentes\n\n- Configuración\n  - [ ] Cuenta creada y Términos revisados\n  - [ ] Menú cargado (revisado si se importó con IA)\n  - [ ] Recetas vinculadas a productos\n  - [ ] IVA configurado por producto/venta (16% u 8% en zona fronteriza)\n  - [ ] Precios de delivery ajustados con la calculadora\n  - [ ] Usuarios, PIN y permisos asignados\n  - [ ] Pruebas de impresión y cajón\n  - [ ] Prueba en modo offline y verificación de sincronización\n\n- Puesta en marcha\n  - [ ] Día piloto con registro paralelo (POS + manual)\n  - [ ] Corte con separación por forma de pago y arqueo físico\n  - [ ] Conciliación e identificación de diferencias\n  - [ ] Ajustes de recetas/IVA/permisos completados\n  - [ ] Fecha definida para el “salto total” al POS\n\n¿Quieres esta checklist adaptada a tu operación? Pídela a soporte@donpunto.com.\n\n---\n\n## Preguntas frecuentes\n\n- ¿Por qué debería migrar de mi caja manual a un POS en la nube?\n  - Para ahorrar tiempo en cierres, controlar inventario y márgenes por platillo, separar IVA por venta y obtener reportes útiles. Con Don Punto, además, puedes operar sin internet y sincronizar al volver, y exportar reportes a Excel o PDF.\n\n- ¿Qué datos debo preparar antes de empezar la migración?\n  - Menú con precios y variantes, recetas con insumos y cantidades, inventario inicial, cierres recientes, empleados y proveedores. Si tienes el menú impreso, puedes acelerar la captura con “Menú desde una foto” y luego revisar los resultados.\n\n- ¿Puedo usar el celular o la tablet que ya tengo o necesito equipo nuevo?\n  - Puedes usar el celular, la tablet o la computadora que ya tienes.\n\n- ¿Don Punto emite facturas electrónicas (CFDI)?\n  - Para obligaciones fiscales específicas, coordínate con tu contador.\n\n- ¿Cómo se procesan los pagos con tarjeta en Don Punto?\n  - Los pagos con tarjeta se procesan mediante Stripe. Para conocer el tratamiento de datos y proveedores, consulta el Aviso de Privacidad.\n\n- ¿Qué tipo de soporte técnico ofrece Don Punto y cómo lo contacto?\n  - Don Punto ofrece soporte técnico y avisos sobre el servicio. Escríbenos a soporte@donpunto.com.\n"};
